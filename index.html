<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nidal LYASSAMI · Dev IA & Automatisation</title>
    <meta
      name="description"
      content="Portfolio de Nidal LYASSAMI présenté comme un bureau d'OS à explorer : projets, terminal, à propos, contact."
    />

    <!-- Favicon inline (SVG, aucune requête réseau) -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23042f2e'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='%23059669' font-family='monospace'%3EN%3C/text%3E%3C/svg%3E"
    />

    <!-- Polices : Inter (UI) + JetBrains Mono (terminal/code), font-display: swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Préférences posées avant le paint pour éviter tout flash (anti-FOUC).
         Thème par défaut : dark. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("nidalos-theme");
          document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
          if (localStorage.getItem("nidalos-reduce-motion") === "true") {
            document.documentElement.dataset.reduceMotion = "true";
          }
          document.documentElement.lang = "fr";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>

    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/desktop.css" />
    <link rel="stylesheet" href="css/windows.css" />
    <link rel="stylesheet" href="css/boot.css" />
    <link rel="stylesheet" href="css/apps/content.css" />
    <link rel="stylesheet" href="css/apps/about.css" />
    <link rel="stylesheet" href="css/apps/terminal.css" />
    <link rel="stylesheet" href="css/apps/monitor.css" />
    <link rel="stylesheet" href="css/mobile.css" />
  </head>

  <body>
    <!-- Repli sans JavaScript : l'essentiel reste accessible -->
    <noscript>
      <div style="max-width: 640px; margin: 64px auto; padding: 0 24px; color: #e7eae9; font-family: sans-serif;">
        <h1>Nidal LYASSAMI, Dev IA &amp; Automatisation</h1>
        <p>Ce portfolio interactif nécessite JavaScript. En attendant, voici l'essentiel :</p>
        <ul style="line-height: 2;">
          <li><a href="assets/cv/CV_Nidal_Lyassami_FR.pdf">Télécharger le CV (PDF)</a></li>
          <li><a href="mailto:nidalyassami@gmail.com">nidalyassami@gmail.com</a></li>
          <li><a href="https://linkedin.com/in/nidal-lyassami">LinkedIn</a></li>
          <li><a href="https://github.com/k-aka-shi">GitHub</a></li>
        </ul>
      </div>
    </noscript>

    <!-- Séquence de démarrage (retirée par boot.js) -->
    <div id="boot" class="boot" role="status" aria-live="polite">
      <div class="boot__inner">
        <div class="boot__logo">L'Atelier</div>
        <pre id="boot-log" class="boot__log"></pre>
      </div>
    </div>

    <!-- Barre système (haut) -->
    <header id="topbar" class="topbar">
      <div class="topbar__left">
        <button
          id="brand-menu-btn"
          class="topbar__brand"
          type="button"
          aria-haspopup="true"
          aria-expanded="false"
          aria-controls="brand-menu"
        >
          L'Atelier
        </button>
        <div id="brand-menu" class="topbar__menu" role="menu" hidden>
          <a href="https://linkedin.com/in/nidal-lyassami" target="_blank" rel="noopener" role="menuitem">LinkedIn</a>
          <a href="https://github.com/k-aka-shi" target="_blank" rel="noopener" role="menuitem">GitHub</a>
          <a href="mailto:nidalyassami@gmail.com" role="menuitem">Email</a>
        </div>
      </div>
      <div class="topbar__right">
        <span id="topbar-clock" class="topbar__clock" aria-label="Heure">--:--</span>
        <button id="system-indicator" class="topbar__icon-btn" type="button" aria-label="Moniteur système"></button>
        <button id="theme-toggle" class="topbar__icon-btn" type="button" aria-label="Basculer le thème"></button>
      </div>
    </header>

    <!-- Bureau -->
    <main id="desktop" class="desktop">
      <div id="desktop-icons" class="desktop__icons"></div>
      <div id="windows-layer" class="windows-layer"></div>
    </main>

    <!-- Dock (bas) -->
    <nav id="dock" class="dock" aria-label="Dock des applications"></nav>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
